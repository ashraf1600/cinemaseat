# nginx config for the CinemaSeat SPA.
#
# * Serves the built Vite bundle from /usr/share/nginx/html.
# * Falls back to /index.html for any path that isn't a real file —
#   this lets React Router (BrowserRouter) handle client-side routes
#   like /bookings/bk_abc123 without 404ing on a hard refresh.
# * Proxies /api/* to the `backend` service over the docker network.
#   Same-origin means the SPA doesn't need CORS headers; the backend
#   already permits the front-door origin (set DJANGO_ALLOWED_HOSTS in
#   .env).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip is on by default in nginx:alpine, but be explicit.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml;

    # Long-cache hashed assets emitted by Vite under /assets/.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /api/* -> Django. We pass the Host header so Django's
    # ALLOWED_HOSTS check still passes, and we forward the standard
    # X-Forwarded-* headers so access logs see the real client.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Webhooks from the gateway come through this proxy too.
        proxy_read_timeout 60s;
    }

    # Healthcheck endpoint (useful for orchestrators that probe /).
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback: any non-asset GET serves index.html so React Router
    # can take over. Real files (favicon, manifest.json, etc.) are
    # served directly by try_files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}