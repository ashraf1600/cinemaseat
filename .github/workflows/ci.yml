# ============================================================================
# CinemaSeat — required CI check.
#
# This workflow is the single source of truth for "is this branch mergeable?".
# It runs on every pull request and every push to main. Branch protection
# on `main` should mark this job as required.
#
# Two test passes run on every CI invocation:
#   1. sqlite   — the full fast suite, including the Postgres-only
#                 concurrency test which is auto-skipped by
#                 `backend/conftest.py` when the engine is SQLite.
#   2. postgres — the same suite plus the concurrency test (which actually
#                 runs against real threads because Postgres handles
#                 concurrent writers correctly). Concurrency is the whole
#                 point of this codebase so we test it on every PR.
#
# A migration step also runs in CI to catch any model/migration drift before
# it lands on main.
# ============================================================================

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel any in-flight run for the same ref so a force-push doesn't burn
# runner minutes on a stale commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # 1) Fast check on SQLite (matches the local dev experience).
  # ---------------------------------------------------------------------
  test-sqlite:
    name: pytest (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        working-directory: backend
        run: |
          python -m pytest -v --tb=short

  # ---------------------------------------------------------------------
  # 2) Same suite on PostgreSQL — exercises the real concurrency path.
  # ---------------------------------------------------------------------
  test-postgres:
    name: pytest (postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cinemaseat
          POSTGRES_USER: cinemaseat
          POSTGRES_PASSWORD: cinemaseat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinemaseat -d cinemaseat"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # Tell Django to use Postgres for this job. The settings module
      # reads DB_BACKEND and switches engines accordingly.
      DB_BACKEND: postgres
      POSTGRES_DB: cinemaseat
      POSTGRES_USER: cinemaseat
      POSTGRES_PASSWORD: cinemaseat
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_SECRET_KEY: ci-secret-not-used-for-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -U cinemaseat && break
            sleep 1
          done

      - name: Run migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run pytest
        working-directory: backend
        env:
          # Use the env-driven settings module so DB_BACKEND=postgres
          # actually switches the engine. The default ``settings_test``
          # hardcodes SQLite — fine for the SQLite job above, but for
          # this one we want real Postgres.
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          python -m pytest -v --tb=short

  # ---------------------------------------------------------------------
  # 3) Front-end build sanity check — catches Vite build breakage on PRs
  #    even though no one is expected to ship the client yet.
  # ---------------------------------------------------------------------
  build-client:
    name: build client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci || npm install

      - name: Build
        working-directory: client
        run: npm run build