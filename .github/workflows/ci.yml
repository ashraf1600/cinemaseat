name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  backend:
    name: Backend - Django checks and tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DB_BACKEND: sqlite
          HOLD_TTL_SECONDS: "30"
        run: |
          python manage.py check

      - name: Check migrations
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DB_BACKEND: sqlite
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "False"
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
          DB_BACKEND: sqlite
          HOLD_TTL_SECONDS: "30"
          GATEWAY_BASE_URL: http://127.0.0.1:9000
        run: |
          pytest -q


  frontend:
    name: Frontend - Lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Run ESLint
        run: |
          npm run lint

      - name: Build frontend
        run: |
          npm run build


  docker:
    name: Docker - build images
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create CI backend environment
        run: |
          cat > backend/.env <<'EOF'
          DJANGO_SECRET_KEY=ci-only-secret-key
          DJANGO_DEBUG=False
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          DB_BACKEND=sqlite
          HOLD_TTL_SECONDS=30
          GATEWAY_BASE_URL=http://gateway:9000
          EOF

      - name: Build backend Docker image
        run: |
          docker build \
            -t cinemaseat-backend:ci \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t cinemaseat-client:ci \
            ./client